# Publishes server.json to the official MCP registry (com.allscreenshots/allscreenshots).
# Manual only: run from the Actions tab after bumping "version" in server.json.
# Domain authentication uses the public proof on allscreenshots.com and the
# MCP_REGISTRY_PRIVATE_KEY repository secret (Ed25519 seed, 64 hex characters).
name: Publish to MCP registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Login (allscreenshots.com domain)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "Configure the MCP_REGISTRY_PRIVATE_KEY repository secret before publishing."
            exit 1
          fi
          ./mcp-publisher login http --domain=allscreenshots.com --private-key="$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish server.json
