# Publishes server.json to the official MCP registry (io.github.allscreenshots/allscreenshots).
# Manual only: run from the Actions tab after bumping "version" in server.json.
# Auth uses GitHub Actions OIDC, so no secrets are needed for io.github.allscreenshots/* names.
name: Publish to MCP registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish server.json
